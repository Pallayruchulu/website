<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1d4a37">
  <title>Staff · Pallay Ruchulu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ponnala&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --green: #1d4a37; --green-2: #2c6a4f; --soft: #e4efe7; --bg: #f6f4ee; --ink: #1f2a24; --muted: #6b766f; --line: #e7e2d6; --gold: #c99a2e; --gold-soft: #f6e6bd; --good: #2f8a4f; --warn: #b7791f; --crit: #c0392b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Poppins, system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; padding-bottom: 40px; }
    header { background: var(--green); color: #fff; padding: 18px 16px 56px; }
    .logo { font-family: Ponnala, sans-serif; font-size: 1.6rem; line-height: 1.3; color: var(--gold-soft); }
    header h1 { margin: 6px 0 0; font-size: 1.35rem; }
    header p { margin: 2px 0 0; opacity: .8; font-size: .9rem; }
    main { max-width: 560px; margin: -44px auto 0; padding: 0 14px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .card h2 { margin: 0 0 10px; font-size: 1rem; }
    .status { display: flex; align-items: center; gap: 12px; }
    .dot { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 1.4rem; flex: none; }
    .s-present .dot { background: #e3f3e8; } .s-away .dot { background: #fbefd9; } .s-absent .dot, .s-out .dot { background: #eee; }
    .status b { display: block; font-size: 1.1rem; }
    .status small { color: var(--muted); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 14px; padding: 15px; font: 600 1.02rem Poppins, sans-serif; cursor: pointer; }
    .btn.primary { background: var(--green); color: #fff; }
    .btn.ghost { background: #fff; color: var(--green); border: 1.5px solid var(--green); }
    .btn:disabled { opacity: .55; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .request { background: #fff3d1; border: 2px solid var(--gold); border-radius: 16px; padding: 16px; animation: pulse 1.6s infinite; }
    .request b { display: block; margin-bottom: 8px; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(201, 154, 46, .2); } }
    .msgs { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; padding: 2px; }
    .msg { max-width: 85%; padding: 9px 12px; border-radius: 14px; font-size: .92rem; }
    .msg time { display: block; font-size: .72rem; color: var(--muted); margin-top: 3px; }
    .msg.owner { background: var(--soft); align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg.staff { background: var(--green); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.staff time { color: rgba(255, 255, 255, .7); }
    .msg.task { background: var(--gold-soft); border: 1px solid #e6cf8f; }
    .msg.task.done { opacity: .65; }
    .msg .done-btn { margin-top: 6px; border: 0; background: var(--green); color: #fff; border-radius: 8px; padding: 6px 12px; font: 600 .82rem Poppins, sans-serif; cursor: pointer; }
    .reply { display: flex; gap: 8px; margin-top: 10px; }
    input { font: inherit; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; width: 100%; }
    .reply button { border: 0; background: var(--green); color: #fff; border-radius: 12px; padding: 0 16px; font: 600 .95rem Poppins, sans-serif; }
    .pos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .pos button { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 10px; font: inherit; text-align: left; cursor: pointer; }
    .pos button:disabled { opacity: .45; }
    .pos b { display: block; font-size: .9rem; }
    .pos small { color: var(--muted); }
    .bill-line { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .bill-line button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: #fff; }
    .total { display: flex; justify-content: space-between; font-size: 1.15rem; margin: 10px 0; }
    .seg { display: flex; gap: 6px; margin-bottom: 10px; }
    .seg button { flex: 1; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 10px; font: 500 .9rem Poppins, sans-serif; }
    .seg button.on { border-color: var(--green); background: var(--soft); color: var(--green); }
    .stats { display: flex; gap: 10px; }
    .stats div { flex: 1; background: var(--bg); border-radius: 12px; padding: 10px; }
    .stats b { display: block; font-size: 1.3rem; }
    .stats small { color: var(--muted); }
    .muted { color: var(--muted); }
    .small { font-size: .84rem; }
    .err { color: var(--crit); font-size: .9rem; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 120px); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; transition: transform .3s; z-index: 9; max-width: calc(100% - 32px); }
    .toast.show { transform: translate(-50%, 0); }
    .toast.bad { background: var(--crit); }
    .busy { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: grid; place-items: center; z-index: 8; color: #fff; font-weight: 600; text-align: center; padding: 20px; }
    .busy[hidden] { display: none; }
    .invalid { text-align: center; padding: 80px 20px; }
  </style>
</head>
<body>
<header>
  <div class="logo">పల్లె రుచులు</div>
  <h1 id="hello">Hello 👋</h1>
  <p id="stall"></p>
</header>
<main id="main">
  <div id="requestBox" class="request" hidden>
    <b>🔔 Owner asked for a selfie from the stall</b>
    <button class="btn primary" id="answerBtn" type="button">📸 Send selfie</button>
  </div>

  <section class="card">
    <div class="status" id="statusBox"><div class="dot">⏳</div><div><b>Loading…</b></div></div>
    <div class="row">
      <button class="btn primary" id="inBtn" type="button">📸 Check in</button>
      <button class="btn ghost" id="outBtn" type="button">🏁 Check out</button>
    </div>
    <p class="muted small" style="margin:10px 0 0">Check-in needs a selfie and your location. Location is taken <b>only</b> when you check in and check out — never in between.</p>
  </section>

  <section class="card">
    <h2>💬 Messages & tasks from owner</h2>
    <div class="msgs" id="msgs"></div>
    <form class="reply" id="replyForm">
      <input id="replyText" placeholder="Type a reply… (e.g. 5 idly packets left)" maxlength="500" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>

  <section class="card">
    <h2>🛒 Record a stall sale</h2>
    <div class="stats"><div><b id="tPk">0</b><small>Packets sold today</small></div><div><b id="tRs">₹0</b><small>Sales today</small></div></div>
    <div class="pos" id="pos" style="margin-top:12px"></div>
    <div id="bill"></div>
    <div class="total"><span>Total</span><b id="billTotal">₹0</b></div>
    <div class="seg" id="paySeg"><button type="button" data-p="cash" class="on">💵 Cash</button><button type="button" data-p="upi">📱 UPI</button></div>
    <p class="err" id="saleErr"></p>
    <button class="btn primary" id="saleBtn" type="button">Save sale</button>
  </section>
</main>
<input type="file" id="cam" accept="image/*" capture="user" hidden>
<div class="busy" id="busy" hidden></div>
<div class="toast" id="toast"></div>
<script src="/staff.js"></script>
</body>
</html>
